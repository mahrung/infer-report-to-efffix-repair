[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infer-report-to-efffix-repair"
version = "0.1.0"
description = "Convert Infer static analysis reports to EffFix repair configurations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
efffix-repair = "main:main"

[tool.setuptools.packages.find]
include = ["algorithm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require Docker)",
]

[tool.coverage.run]
source = ["algorithm", "main", "get_running_containers"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "venv/*",
    # Orchestration code that requires Docker for testing
    "algorithm/run_efffix.py",
    "algorithm/components/run_parallel.py",
    "algorithm/components/clone_project_source.py",
    "algorithm/components/generate_configs_from_report.py",
    "algorithm/utils/get_target_container.py",
    "algorithm/utils/parse_arguments.py",
    # Main CLI entry point
    "main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 60
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
